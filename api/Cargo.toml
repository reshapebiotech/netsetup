[package]
name = "api"
version = "0.2.4"
edition = "2024"
license = "Apache-2.0"

[[bin]]
name = "reshape-netsetup"
path = "src/main.rs"

[dependencies]
async-trait = "0.1.92"
axum = "0.8.9"
axum-extra = "0.12.6"
futures-util = "0.3.34"
url = "2.5.8"
hickory-server = "0.26.3"
mime_guess = "2.0.5"
parking_lot = "0.12.5"
rust-embed = "8.13.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
socket2 = { version = "0.6.5", features = ["all"] }
thiserror = "2.0.21"
tokio = { version = "1.53.3", features = ["full", "rt-multi-thread", "macros"] }
toml = "1.1.8"
tower = { version = "0.5.3", features = ["util"] }
tower-http = { version = "0.7.1", features = ["fs", "trace"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
uuid = { version = "1.28.0", features = ["serde", "v4"] }

[dev-dependencies]
axum-test = "21.1.0"
proptest = "1.12.0"
