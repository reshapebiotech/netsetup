services:
  api:
    image: ghcr.io/reshapebiotech/machine-setup-api:main
    build:
      context: setup-api
      dockerfile: Dockerfile
    container_name: setup-api
    volumes:
      - /var/run/dbus/system_bus_socket:/var/run/dbus/system_bus_socket
    privileged: true
    restart: always
    ports:
      - 9000:9000
    env_file:
      - .env
    profiles:
      - ""
      - api
    develop:
      watch:
        - path: setup-api
          target: /usr/src/app
          action: sync

  api-simulated:
    build:
      context: setup-api
      dockerfile: Dockerfile
    container_name: setup-api-simulated
    volumes:
      - dbus-socket:/var/run/dbus/
    privileged: true
    ports:
      - 9000:9000
    env_file:
      - .env
    depends_on:
      network-manager:
        condition: service_healthy
    profiles:
      - api-simulated
      - all-simulated
    develop:
      watch:
        - path: setup-api
          target: /usr/src/app
          action: sync

  ui:
    image: ghcr.io/reshapebiotech/machine-setup-ui:main
    build:
      context: setup-ui
      dockerfile: Dockerfile
    container_name: setup-ui
    restart: always
    ports:
      - 80:3000
    env_file:
      - .env
    profiles:
      - ""
      - all-simulated
    develop:
      watch:
        - path: setup-ui
          target: /usr/src/app
          action: sync

  network-manager:
    build:
      context: .
      dockerfile_inline: |
        FROM python:3.11
        RUN apt-get update && apt-get install -y libdbus-1-dev network-manager
        RUN pip install --break-system-packages python-dbusmock
        RUN mkdir -p /etc/dbus-1/system.d
        RUN echo '\
        <!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-Bus Bus Configuration 1.0//EN" \
        "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd"> \
        <busconfig> \
          <listen>unix:path=/var/run/dbus/system_bus_socket</listen> \
          <policy user="root"> \
            <allow own="org.freedesktop.NetworkManager"/> \
            <allow send_destination="org.freedesktop.NetworkManager"/> \
            <allow send_interface="org.freedesktop.DBus.Properties"/> \
          </policy> \
        </busconfig>' > /etc/dbus-1/system.d/custom.conf
    command:
      - "sh"
      - "-c"
      - |
        mkdir -p /var/run/dbus /run/dbus &&
        rm -f /var/run/dbus/system_bus_socket /run/dbus/dbus.pid &&
        echo 'Starting dbus-daemon' && dbus-daemon --system --nofork --nopidfile & 
        python3 -m dbusmock --system -t networkmanager -e \
          sh -c ' \
            gdbus call --system -d org.freedesktop.NetworkManager -o /org/freedesktop/NetworkManager -m org.freedesktop.DBus.Mock.AddEthernetDevice "my_ethernet_device" "eth0" "100" &&
            gdbus call --system -d org.freedesktop.NetworkManager -o /org/freedesktop/NetworkManager -m org.freedesktop.DBus.Mock.AddWiFiDevice "my_wifi_device" "wlan0" "100" &&
            gdbus call --system -d org.freedesktop.NetworkManager -o /org/freedesktop/NetworkManager/Devices/my_wifi_device -m org.freedesktop.DBus.Mock.AddAccessPoint "/org/freedesktop/NetworkManager/Devices/my_wifi_device" "ap0" "Too fly for a WiFi" "00:11:22:33:44:55" 2 2412 5400 23 0 &&
            gdbus call --system -d org.freedesktop.NetworkManager -o /org/freedesktop/NetworkManager/Devices/my_wifi_device -m org.freedesktop.DBus.Mock.AddAccessPoint "/org/freedesktop/NetworkManager/Devices/my_wifi_device" "ap1" "Tell your WiFi said Hi" "00:11:22:33:44:55" 2 2412 5400 67 0 &&
            gdbus call --system -d org.freedesktop.NetworkManager -o /org/freedesktop/NetworkManager/Devices/my_wifi_device -m org.freedesktop.DBus.Mock.AddAccessPoint "/org/freedesktop/NetworkManager/Devices/my_wifi_device" "ap2" "🐟🐟🐟🐟🐟" "00:11:22:33:44:66" 2 2412 5400 89 0 &&
            gdbus call --system -d org.freedesktop.NetworkManager -o /org/freedesktop/NetworkManager/Devices/my_wifi_device -m org.freedesktop.DBus.Mock.AddAccessPoint "/org/freedesktop/NetworkManager/Devices/my_wifi_device" "ap3" "Wu-Tang LAN" "00:11:22:33:44:66" 2 2412 5400 93 520 &&
            gdbus call --system -d org.freedesktop.NetworkManager -o /org/freedesktop/NetworkManager/Devices/my_wifi_device -m org.freedesktop.DBus.Mock.AddAccessPoint "/org/freedesktop/NetworkManager/Devices/my_wifi_device" "ap4" "Get off my LAN, kids" "00:11:22:33:44:66" 2 2412 5400 100 264 &&
            gdbus call --system -d org.freedesktop.NetworkManager -o /org/freedesktop/NetworkManager/Devices/my_wifi_device -m org.freedesktop.DBus.Mock.AddAccessPoint "/org/freedesktop/NetworkManager/Devices/my_wifi_device" "ap5" "🍕🍕🍕🍕🍕" "00:11:22:33:44:66" 2 2412 5400 100 0 &&
            gdbus call --system -d org.freedesktop.NetworkManager -o /org/freedesktop/NetworkManager/Devices/my_wifi_device -m org.freedesktop.DBus.Mock.AddAccessPoint "/org/freedesktop/NetworkManager/Devices/my_wifi_device" "ap6" "🍔🍔🍔🍔🍔" "00:11:22:33:44:66" 2 2412 5400 100 0 &&
            gdbus call --system -d org.freedesktop.NetworkManager -o /org/freedesktop/NetworkManager/Devices/my_wifi_device -m org.freedesktop.DBus.Mock.AddAccessPoint "/org/freedesktop/NetworkManager/Devices/my_wifi_device" "ap7" "🍟🍟🍟🍟🍟" "00:11:22:33:44:66" 2 2412 5400 100 0 &&
            gdbus call --system -d org.freedesktop.NetworkManager -o /org/freedesktop/NetworkManager/Devices/my_wifi_device -m org.freedesktop.DBus.Mock.AddAccessPoint "/org/freedesktop/NetworkManager/Devices/my_wifi_device" "ap8" "🍦🍦🍦🍦🍦" "00:11:22:33:44:66" 2 2412 5400 100 0 &&
            gdbus call --system -d org.freedesktop.NetworkManager -o /org/freedesktop/NetworkManager/Devices/my_wifi_device -m org.freedesktop.DBus.Mock.AddAccessPoint "/org/freedesktop/NetworkManager/Devices/my_wifi_device" "ap9" "🍩🍩🍩🍩🍩" "00:11:22:33:44:66" 2 2412 5400 100 0 &&
            gdbus call --system -d org.freedesktop.NetworkManager -o /org/freedesktop/NetworkManager/Devices/my_wifi_device -m org.freedesktop.DBus.Mock.AddAccessPoint "/org/freedesktop/NetworkManager/Devices/my_wifi_device" "ap10" "🍪🍪🍪🍪🍪" "00:11:22:33:44:66" 2 2412 5400 100 0 &&
            gdbus call --system -d org.freedesktop.NetworkManager -o /org/freedesktop/NetworkManager/Devices/my_wifi_device -m org.freedesktop.DBus.Mock.AddAccessPoint "/org/freedesktop/NetworkManager/Devices/my_wifi_device" "ap11" "🍫🍫🍫🍫🍫" "00:11:22:33:44:66" 2 2412 5400 100 0 &&
            gdbus call --system -d org.freedesktop.NetworkManager -o /org/freedesktop/NetworkManager/Devices/my_wifi_device -m org.freedesktop.DBus.Mock.AddAccessPoint "/org/freedesktop/NetworkManager/Devices/my_wifi_device" "ap12" "🍬🍬🍬🍬🍬" "00:11:22:33:44:66" 2 2412 5400 100 0 &&
            gdbus call --system -d org.freedesktop.NetworkManager -o /org/freedesktop/NetworkManager/Devices/my_wifi_device -m org.freedesktop.DBus.Mock.AddAccessPoint "/org/freedesktop/NetworkManager/Devices/my_wifi_device" "ap13" "🍭🍭🍭🍭🍭" "00:11:22:33:44:66" 2 2412 5400 100 0 &&
            gdbus call --system -d org.freedesktop.NetworkManager -o /org/freedesktop/NetworkManager/Devices/my_wifi_device -m org.freedesktop.DBus.Mock.AddAccessPoint "/org/freedesktop/NetworkManager/Devices/my_wifi_device" "ap14" "🍮🍮🍮🍮🍮" "00:11:22:33:44:66" 2 2412 5400 100 0 &&
            tail -f /dev/null'
    volumes:
      - dbus-socket:/var/run/dbus/
    healthcheck:
      test: ["CMD", "test", "-e", "/var/run/dbus/system_bus_socket"]
      interval: 5s
      timeout: 3s
      retries: 5
    profiles:
      - all-simulated
      - api-simulated

volumes:
  dbus-socket:
