name: Format

on:
  push:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  format-projects:
    timeout-minutes: 10
    name: Format projects
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v5
      - name: Rust format check
        run: cargo fmt --check
      - name: Web typecheck
        run: cd web && bun install --frozen-lockfile && bun run check
