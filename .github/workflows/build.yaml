name: Build Containers

on:
  push:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-ui:
    timeout-minutes: 2
    name: Build UI
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build container images
        uses: docker/build-push-action@v6
        with:
          context: ./setup-ui
          file: ./setup-ui/Dockerfile
          push: false
          cache-from: type=gha
          cache-to: type=gha

  build-api:
    timeout-minutes: 5
    name: Build API
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build container images
        uses: docker/build-push-action@v6
        with:
          context: ./setup-api
          file: ./setup-api/Dockerfile
          push: false
          cache-from: type=gha
          cache-to: type=gha
